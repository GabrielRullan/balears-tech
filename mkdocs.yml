site_name: balears.tech
site_url: https://balears.tech
site_description: "Tecnologia, dades i creixement per a empreses i entitats de les Illes Balears"
site_author: "Gabriel Rul-lan"
copyright: "Copyright &copy; 2026 balears.tech · Iniciativa de tecnologia i dades a les Illes Balears"

theme:
  name: material
  language: ca
  logo: assets/img/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Plus Jakarta Sans
    code: JetBrains Mono
  palette:
    # Mode Clar (Mediterranean Tech Commons)
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Mode fosc
    # Mode Fosc
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Mode clar
  features:
    - navigation.instant
    - navigation.top
    - toc.follow

extra_css:
  - https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap
  - assets/css/custom.css

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - def_list

nav:
  - Inici: index.md
